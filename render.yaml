# Render blueprint — connect this repo on dashboard.render.com and the
# three services below are created automatically.
# See docs/DEPLOY.md for the full step-by-step guide.

services:
  # ---------- Managed Redis ----------
  - type: redis
    name: ai-reliability-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ---------- API (FastAPI) ----------
  - type: web
    name: ai-reliability-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        sync: false # set manually: your Supabase connection string
      - key: REDIS_URL
        fromService:
          name: ai-reliability-redis
          type: redis
          property: connectionString
      - key: API_KEY
        sync: false # required for public deployment
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-dashboard.vercel.app
      - key: GITHUB_TOKEN
        sync: false # repo scope for private repos + change proposals
      - key: GITHUB_OWNER
        sync: false
      - key: AI_PROVIDER
        value: demo
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: RATE_LIMIT_REQUESTS
        value: 120
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: CACHE_TTL_SECONDS
        value: 30

  # ---------- Worker (monitoring + jobs + project sync) ----------
  - type: worker
    name: ai-reliability-worker
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.run
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        sync: false # same Supabase connection string as the API
      - key: REDIS_URL
        fromService:
          name: ai-reliability-redis
          type: redis
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
